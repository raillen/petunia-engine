[build]
# AGENTS.md section 4: never run the compiler unbounded on this machine.
jobs = 2
# One build folder for everyone (cargo in a terminal, rust-analyzer, scripts, agents), in RAM
# because the disk runs full. A second `target/` inside the project only duplicates ~1 GB.
# Cleaned by scripts/clean-builds.sh; it disappears on reboot and rebuilds in about a minute.
target-dir = "/tmp/petunia-engine-target"

[target.x86_64-unknown-linux-gnu]
# lld links much faster than the default GNU linker (build-time lever, experiment S0).
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
