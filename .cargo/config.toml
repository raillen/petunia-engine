[build]
# AGENTS.md section 4: never run the compiler unbounded on this machine.
jobs = 2
# One build folder for everything in THIS working copy (cargo in a terminal, rust-analyzer, scripts,
# agents), in RAM because the disk runs full. A second `target/` inside the project only duplicates
# ~1 GB. Cleaned by scripts/clean-builds.sh; it disappears on reboot and rebuilds in about a minute.
#
# This file is tracked, so it cannot hold a value that differs per checkout: a second working copy
# overrides the folder with the `CARGO_TARGET_DIR` environment variable instead of editing this
# line. Never point two checkouts at the same folder: cargo does not put the checkout path in its
# unit hash, so they overwrite the same `libpetunia_math-<hash>.rmeta` and the build fails with a
# phantom `unresolved import petunia_math::CubicBezierSpline` while the symbol exists in the source.
target-dir = "/tmp/petunia-engine-target"

[target.x86_64-unknown-linux-gnu]
# lld links much faster than the default GNU linker (build-time lever, experiment S0).
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
