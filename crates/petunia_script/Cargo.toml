[package]
name = "petunia_script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Script Host: compiles and runs Aipo scripts against the world, with capabilities, budgets and an API generated from data."

[dependencies]
petunia_math.workspace = true
petunia_world.workspace = true
petunia_commands.workspace = true
petunia_project.workspace = true
petunia_physics.workspace = true
petunia_graph.workspace = true
serde_json.workspace = true
# Aipo is our own language (DR-06, DR-25). Path dependencies on the sibling checkout; heavy optional
# features (wasmtime, regex, unicode tables) stay off.
aipo-source = { path = "../../../aipo-lang/crates/aipo-source" }
aipo-diagnostics = { path = "../../../aipo-lang/crates/aipo-diagnostics" }
aipo-syntax = { path = "../../../aipo-lang/crates/aipo-syntax" }
aipo-hir = { path = "../../../aipo-lang/crates/aipo-hir" }
aipo-sema = { path = "../../../aipo-lang/crates/aipo-sema" }
aipo-ir = { path = "../../../aipo-lang/crates/aipo-ir" }
aipo-bytecode = { path = "../../../aipo-lang/crates/aipo-bytecode" }
aipo-vm = { path = "../../../aipo-lang/crates/aipo-vm", default-features = false }
aipo-runtime = { path = "../../../aipo-lang/crates/aipo-runtime" }
aipo-stdlib = { path = "../../../aipo-lang/crates/aipo-stdlib", default-features = false }
aipo-host = { path = "../../../aipo-lang/crates/aipo-host" }
aipo-formatter = { path = "../../../aipo-lang/crates/aipo-formatter" }

[lints]
workspace = true
