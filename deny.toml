# cargo-deny configuration. Permissive licenses only (DR-01: runtime stays permissive).
# MPL-2.0 (symphonia, pulled in by the audio library) is intentionally NOT allowed yet:
# add a recorded exception when audio lands.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "CC0-1.0",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
ignore = [
    # Transitive via winit -> sctk-adwaita -> ab_glyph -> owned_ttf_parser.
    "RUSTSEC-2026-0192",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
